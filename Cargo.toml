[package]
name = "undir"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Move all children of one directory into another"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.177"
renamore = { git = "https://github.com/mevanlc/renamore", rev = "10c9775a6ee8246846197965f6dc67fe00357aa3" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3.27.0"
